[package]
name = "freeco-ai-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for FreEco.ai"

[[bin]]
name = "freeco-ai"
path = "src/main.rs"

[dependencies]
freeco-types = { path = "../freeco-types" }
freeco-kernel = { path = "../freeco-kernel" }
freeco-api = { path = "../freeco-api" }
freeco-migrate = { path = "../freeco-migrate" }
freeco-skills = { path = "../freeco-skills" }
freeco-extensions = { path = "../freeco-extensions" }
zeroize = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
freeco-kernel-runtime = { path = "../freeco-kernel-runtime" }
uuid = { workspace = true }
ratatui = { workspace = true }
colored = { workspace = true }
tempfile = { workspace = true }
