name: CodeQL

# Advanced setup, replacing GitHub's default CodeQL configuration.
#
# Default setup analyses Rust with `build-mode: none`, which reads the source
# without ever compiling it. With no build, CodeQL cannot resolve types across
# crates or link calls to their targets, and it reports exactly that: "Low Rust
# analysis quality — percentage of calls with call target: 39% (threshold 50%)".
# A database that cannot see half the call graph misses real findings and
# invents false ones. It flagged a hard-coded nonce in this repository that is a
# literal inside a `#[cfg(test)]` replay-detection test, which is what that test
# has to do to prove replays are rejected.
#
# Building the workspace first gives CodeQL the dependency graph and resolved
# types, which is what those thresholds are measuring.
#
# NOTE: default setup must be turned off in Settings → Code security → Code
# scanning, or the two configurations conflict and this workflow is ignored.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so alerts keep arriving on code nobody has touched recently.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust uses build-mode none, which is the mode GitHub's default
          # setup used for this repository and is therefore known to work here.
          # `manual` is documented as supported but the init step rejected it in
          # this repo three times, and a job that cannot initialise produces no
          # analysis at all — worse than an analysis with imperfect resolution.
          # The `cargo fetch` step below is what improves the resolution metric:
          # the extractor can only resolve calls into dependencies whose sources
          # are actually on disk, and a bare checkout has none of them.
          - language: rust
            build-mode: none
          # These need no build step; scanning the source is the supported mode.
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          # Keyed separately so a CodeQL build never evicts the CI build cache.
          shared-key: codeql

      - name: Install Linux build dependencies
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libglib2.0-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libwebkit2gtk-4.1-dev

      # Vendor the dependency sources before extraction. "Percentage of calls
      # with call target: 39%" is largely calls into crates whose source was
      # never downloaded, so there was nothing to resolve them against.
      - name: Fetch dependency sources
        if: matrix.language == 'rust'
        run: cargo fetch --locked

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        # Rust analysis is still a preview feature and the init step refuses to
        # start without this opt-in. GitHub's default setup sets it for you,
        # which is why Rust was being analysed before this workflow existed
        # while the same init here failed with JavaScript and Python passing.
        env:
          CODEQL_ENABLE_EXPERIMENTAL_FEATURES: true
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
