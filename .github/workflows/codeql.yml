name: CodeQL

# Rust is deliberately not analysed here.
#
# CodeQL's Rust support is preview-stage: default setup analysed it with
# build-mode none and reported "percentage of calls with call target: 39%"
# against a 50% threshold, which produced a critical "hard-coded nonce" alert
# for a literal inside a #[cfg(test)] replay test. Advanced setup then refused
# to initialise the Rust job at all, while JavaScript and Python succeeded with
# the same action.
#
# A scanner that resolves half the call graph reports findings that are not
# real and misses ones that are, so acting on it costs more than it returns.
# Rust is covered by `cargo clippy -D warnings` and `cargo audit`, which both
# run in CI and both understand the language properly. Revisit when Rust
# support leaves preview.

# Advanced setup, replacing GitHub's default CodeQL configuration.
#
# Default setup analyses Rust with `build-mode: none`, which reads the source
# without ever compiling it. With no build, CodeQL cannot resolve types across
# crates or link calls to their targets, and it reports exactly that: "Low Rust
# analysis quality — percentage of calls with call target: 39% (threshold 50%)".
# A database that cannot see half the call graph misses real findings and
# invents false ones. It flagged a hard-coded nonce in this repository that is a
# literal inside a `#[cfg(test)]` replay-detection test, which is what that test
# has to do to prove replays are rejected.
#
# Building the workspace first gives CodeQL the dependency graph and resolved
# types, which is what those thresholds are measuring.
#
# NOTE: default setup must be turned off in Settings → Code security → Code
# scanning, or the two configurations conflict and this workflow is ignored.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so alerts keep arriving on code nobody has touched recently.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # These need no build step; scanning the source is the supported mode.
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
