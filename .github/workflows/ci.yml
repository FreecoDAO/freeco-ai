name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Rust library crates (all 3 platforms) ──────────────────────────────────
  check:
    name: Check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.os }}
      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: cargo check --workspace

  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      # Tests that need a display (Tauri) are skipped in headless CI via cfg
      # Tee the output and republish failures into the job summary.
      #
      # Job logs need admin rights to download, so a contributor without them
      # sees only "exit code 101" on a failing platform and has to guess which
      # test broke. Step summaries are readable by anyone who can see the
      # check, so the failing test names travel with the result.
      - name: cargo test --workspace
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test-output.txt
        shell: bash

      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          {
            echo "### Failing tests on ${{ matrix.os }}"
            echo
            echo '```'
            # The names under "failures:" plus any panic lines, which together
            # identify the test and say why without needing the full log.
            awk '/^failures:$/{f=1;next} /^test result:/{f=0} f' test-output.txt | sort -u
            grep -E "panicked at|assertion .* failed|left:|right:" test-output.txt | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Gate every workspace crate on rustfmt to keep `cargo fmt --all --check` clean.
      # See issue #1121.
      - run: cargo fmt --all -- --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  # ── Secrets scanning (prevent accidental credential commits) ──────────────
  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install TruffleHog v3.95.9
        run: |
          curl -sSfL -o /tmp/trufflehog.tar.gz \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_linux_amd64.tar.gz
          echo "f6d1106b85107d79527ed7a5b98b592beadd8b770dc3c9e8c1ad99e1b2cf127e  /tmp/trufflehog.tar.gz" | sha256sum --check
          tar -xzf /tmp/trufflehog.tar.gz -C /usr/local/bin trufflehog
      - name: Scan for secrets
        run: |
          # The Lob detector is excluded because it matches Rust test
          # function names -- test_derive_session_key_different_nonces,
          # test_image_gen_request_validate_bad_size and 39 others -- and
          # then reports them as *verified* secrets. Verification calls the
          # provider API, and Lob answers non-deterministically, so the
          # identical tree passed once on main and failed the four runs
          # before it. A gate that blocks merges at random teaches people
          # to ignore it, which is worse than not having one.
          #
          # This drops one provably wrong detector, not the scan: every
          # other detector still runs with --only-verified --fail. Revisit
          # if this project ever actually uses Lob.
          trufflehog filesystem . \
            --no-update \
            --fail \
            --only-verified \
            --exclude-detectors=lob \
            --exclude-paths=<(echo -e "target/\n.git/\nCargo.lock")

  # ── Installer smoke test (verify install scripts from Vercel) ──────────────
  install-smoke:
    name: Install Script Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch and syntax-check shell installer
        run: |
          bash -n scripts/install.sh
      - name: Fetch and syntax-check PowerShell installer
        run: |
          pwsh -NoProfile -Command "Get-Content scripts/install.ps1 | Out-Null"
