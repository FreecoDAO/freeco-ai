name: Auto Tag

on:
  push:
    branches: [main]

permissions:
  contents: write
  # Starting the release build is a separate right from pushing the tag:
  # `contents: write` pushes it, `actions: write` runs a workflow. Without
  # both, the tag lands and the build never starts -- which is the exact
  # failure this workflow now exists to prevent.
  actions: write

jobs:
  auto-tag:
    name: Push annotated tag for untagged releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history needed to check existing tags
          fetch-depth: 0

      - name: Read version and conditionally push tag
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # `gh workflow run` reads GH_TOKEN. Same secret: it already has the
          # rights to push the tag, so it can start the build for that tag.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # A skip that reports success is indistinguishable from a tag that
          # was pushed. This workflow went green for both v0.9.0 and v0.9.2
          # while tagging neither, and nobody could tell from the tick. Say
          # loudly what was skipped and why.
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not configured, so no tag was pushed."
            echo "::error::Add it under Settings > Secrets and variables > Actions."
            echo "::error::It needs a personal access token with 'contents: write'"
            echo "::error::-- the default GITHUB_TOKEN cannot push tags that"
            echo "::error::trigger further workflows, which is why the release"
            echo "::error::build never starts."
            exit 1
          fi

          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG="v${VERSION}"
          echo "Detected version: ${VERSION}  (tag: ${TAG})"

          # Silently skip if the tag already exists on the remote
          if git ls-remote --tags origin "${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists — skipping"
            exit 0
          fi

          # Also loud. A missing changelog section is a real omission before a
          # release, not a reason to quietly do nothing.
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section, so no tag"
            echo "::error::was pushed. Add the section describing this release."
            exit 1
          fi

          # Push the annotated tag
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Pushed tag ${TAG}"

          # Start the release build explicitly rather than trusting the tag push
          # to do it. A tag pushed by a workflow only triggers another workflow
          # when the token permits it; when it does not, the tag lands, nothing
          # builds, and no job fails -- so the first sign of trouble is a user
          # asking why the new version never arrived. v0.9.3 was tagged this way
          # and never produced a release.
          #
          # Dispatching on the tag ref means release.yml sees `github.ref_name`
          # as the tag, exactly as it does for a tag push.
          if gh workflow run release.yml --ref "${TAG}"; then
            echo "Dispatched release.yml on ${TAG}"
          else
            echo "::error::Tag ${TAG} was pushed but the release build could not"
            echo "::error::be started. Run it manually: Actions > Release > Run"
            echo "::error::workflow > use workflow from ${TAG}."
            exit 1
          fi
